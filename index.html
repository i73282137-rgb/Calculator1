<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#176b45">
    <title>CestaCusto — Calculadora de custos</title>
    <meta name="description" content="Calcule custos de produtos e receitas aninhadas">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./folders.css">
  </head>
  <body>
    <header>
      <div class="brand"><span>▦</span>Cesta<b>Custo</b></div>
      <div class="syncBadge" id="syncBadge">Somente neste aparelho</div>
      <div class="summary">Custo <strong id="topTotal">R$ 0,00</strong></div>
      <button class="headerIcon" id="importBtn" aria-label="Importar tabela com IA">⇩</button>
      <button class="headerIcon" id="settingsBtn" aria-label="Configurações">⚙</button>
      <button class="primary desktopNew" id="newBtn">＋ Novo produto</button>
    </header>
    <main>
      <aside id="sidebar">
        <div class="asideTitle">
          <div><small>PASTAS E PRODUTOS</small><b id="count">0 produtos</b></div><button id="newCategory" class="newFolder">＋ Pasta</button>
          <button id="closeCatalog" aria-label="Fechar">×</button>
        </div>
        <label class="search">⌕ <input id="search" placeholder="Buscar produto..."></label>
        <nav id="catalog"></nav>
      </aside>
      <div class="scrim" id="scrim"></div>
      <section class="content" id="content"></section>
    </main>
    <nav class="mobileNav">
      <button id="mobileProducts">▤<span>Produtos</span></button>
      <button class="mobileAdd" id="mobileNew">＋</button>
      <button id="mobileSettings">⚙<span>Ajustes</span></button>
    </nav>
    <div id="modalRoot"></div>
    <div class="toast" id="toast"></div>
    <script src="./folders.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
